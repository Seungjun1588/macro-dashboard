name: Daily Data Collection

on:
  schedule:
    - cron: '0 1 * * *'   # 매일 UTC 01:00 (KST 10:00)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest

    # secrets 컨텍스트는 스텝의 if:에서 쓸 수 없어 잡 레벨 env로 한 번 받는다
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Checkout repo (with DB)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 여기서 바로 죽으면 부분 수집분마저 커밋되지 않는다.
      # 판정은 마지막 게이트 스텝으로 미루고, 결과만 기록해둔다.
      - name: Run collector
        id: collect
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scheduler.py

      - name: Data health check (deterministic script)
        run: |
          python scripts/macro_health_check.py | tee health_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js (for Claude Code CLI)
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        if: env.HAS_ANTHROPIC_KEY == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Narrate health report
        if: env.HAS_ANTHROPIC_KEY == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "health_report.md 파일을 읽고 보기 좋게 다듬어 요약해줘" \
            --agent health-report-narrator \
            --permission-mode bypassPermissions \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/macro.db
          git diff --staged --quiet || git commit -m "data: daily collect $(date +%Y-%m-%d)"
          git push

      # 데이터가 저장된 뒤에 판정한다. 수집이 조용히 실패해도 런은 초록이던
      # 문제를 여기서 끊는다 — 빨간 런이 곧 알림이다.
      - name: Fail run on collection problems
        run: |
          FAILED=""
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "::error::수집 스텝 실패 — 소스 전멸 또는 예외 발생"
            FAILED=1
          fi
          python scripts/macro_health_check.py --strict || FAILED=1
          [ -z "$FAILED" ] || exit 1
